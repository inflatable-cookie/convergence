[manifest]
minimum_effigy_version = "0.7.0"

[catalog]
alias = "convergence"

[bootstrap]
setup = ["bootstrap:deps"]

[tasks]
"bootstrap:deps" = "cargo fetch"
check = "cargo check {args}"
build = "cargo build {args}"
fmt = "cargo fmt {args}"
"fmt:check" = "cargo fmt --check"
clippy = "cargo clippy --all-targets {args} -- -D warnings"
test = "cargo nextest run -P ci {args}"
"test:cargo" = "cargo test {args}"
bench = "cargo nextest run -P ci --run-ignored ignored-only {args}"
# External-backend lane (batch 18.4). `backends:up` starts Postgres and
# MinIO through Effigy's managed containers; `backends:test` runs the
# conformance suite against them with the require-gate on, so an unset
# env var fails instead of skipping silently.
"backends:up" = "effigy container up"
"backends:down" = "effigy container down"
"backends:test" = { run = "cargo nextest run -P ci --features backend-postgres,backend-s3 --test backend_conformance {args}", env = { CONVERGE_TEST_POSTGRES_URL = "postgres://postgres:converge@127.0.0.1:5432/converge_test", CONVERGE_TEST_S3_ENDPOINT = "http://127.0.0.1:9000", CONVERGE_TEST_S3_BUCKET = "converge-test", AWS_ACCESS_KEY_ID = "minioadmin", AWS_SECRET_ACCESS_KEY = "minioadmin", CONVERGE_REQUIRE_BACKENDS = "1" } }
backends = [
  { task = "backends:up" },
  { task = "backends:test" },
]
health = [
  { task = "fmt:check" },
  { task = "check" },
]
validate = [
  { task = "health" },
  { task = "clippy" },
  { task = "test" },
]
qa = [
  { task = "validate" },
  { task = "qa:docs" },
]
"qa:docs:links" = "effigy docs check links"
"qa:docs:agent-defaults" = "effigy docs check forbidden AGENTS.md README.md docs/README.md --forbid '--repo .'"
"qa:docs:headings" = "effigy docs check headings docs/README.md docs/vision/README.md docs/roadmaps/README.md docs/logs/README.md --require-heading '## Next Task'"
"qa:docs:index:vision" = "effigy docs check index --policy-index vision"
"qa:docs:next-action:vision" = "effigy docs check next-action --policy vision"
"qa:northstar" = [
  { task = "qa:docs:headings" },
  { task = "qa:docs:index:vision" },
  { task = "qa:docs:next-action:vision" },
]
"qa:docs" = [
  { task = "qa:docs:links" },
  { task = "qa:docs:agent-defaults" },
  { task = "qa:northstar" },
]

# Live external backends for `effigy backends:*`. Catalog services, so
# the compose file is generated rather than repo-owned.
[containers]
default = "backends"

[containers.backends]
driver = "colima"
startup = "detached"
project_name = "convergence-backends"

[containers.backends.services.postgres]
catalog = "postgres"
database = "converge_test"
password = "converge"

[containers.backends.services.minio]
catalog = "minio"

[docs_policy.indexes.vision]
file = "docs/vision/README.md"
dir = "docs/vision"
section = "Vision Artifacts"

[docs_policy.next_actions.vision]
index = "vision"
heading = "## Next Task"
allowlist_file = "docs/policy/vision-next-task-verbs.txt"

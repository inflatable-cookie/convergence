[workspace]
resolver = "2"
members = [
    "crates/converge-model",
    "crates/converge-client",
    "crates/converge-cli",
    "crates/converge-tui",
    "crates/converge-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
fastcdc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tempfile = "3"
converge-model = { path = "crates/converge-model" }
converge-client = { path = "crates/converge-client" }

[workspace]
resolver = "2"
members = [
    "crates/converge-model",
    "crates/converge-client",
    "crates/converge-cli",
    "crates/converge-tui",
    "crates/converge-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
axum = "0.7"
blake3 = "1"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
diffy = "0.4"
fastcdc = "3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
postgres = "0.19"
ratatui = "0.29"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
rust-s3 = { version = "0.35", features = ["sync-rustls-tls"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
getrandom = "0.3"
# `rust_crypto` is not optional decoration: jsonwebtoken 11 selects no
# provider by default and panics at the first verification. Pure Rust
# over `aws_lc_rs` so the build needs no C toolchain.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
# Client-side secrets (g02.019). age gives multi-recipient X25519
# envelopes and scrypt passphrase encryption in one reviewed format.
age = { version = "0.12", features = ["armor"] }
secrecy = "0.10"
rpassword = "7"
converge-model = { path = "crates/converge-model" }
converge-client = { path = "crates/converge-client" }
converge-cli = { path = "crates/converge-cli" }
converge-server = { path = "crates/converge-server" }
